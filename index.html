<!doctype html>
<html lang="en" class="gate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lyle Chadya — Web developer</title>
    <meta name="description" content="Lyle Chadya, web developer. Co-founder of DL Origin. A portfolio that crosses the solar system: React, Three.js and motion." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://2.lyle-portfolio.dev/" />

    <!-- Link preview: the card LinkedIn, X, WhatsApp and Slack show when this address is shared -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lyle Chadya" />
    <meta property="og:title" content="Lyle Chadya: a portfolio that crosses the solar system" />
    <meta property="og:description" content="Scroll from Earth to Saturn to the Milky Way. Scroll-driven 3D built with Three.js and Blender, with live projects in orbit around Saturn." />
    <meta property="og:url" content="https://2.lyle-portfolio.dev/" />
    <meta property="og:image" content="https://2.lyle-portfolio.dev/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="A caped hero flying past Saturn and a floating project screen. Text: A portfolio that crosses the solar system." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lyle Chadya: a portfolio that crosses the solar system" />
    <meta name="twitter:description" content="Scroll from Earth to Saturn to the Milky Way. Scroll-driven 3D built with Three.js and Blender." />
    <meta name="twitter:image" content="https://2.lyle-portfolio.dev/og-image.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="scroll" aria-hidden="true"></div>

    <main id="ui">
      <header class="top">
        <button class="mark" data-jump="0" aria-label="Back to the start">
          <span class="mark-pic" aria-hidden="true"><b id="mark-initials"></b></span>
          <span class="mark-word" id="mark-name"></span>
        </button>
        <p class="counter mono" aria-live="polite"><span id="count-now">00</span><span class="counter-sep">/</span><span id="count-all">06</span></p>
        <button class="sound-btn mono" id="sound-btn" aria-pressed="false"><i aria-hidden="true"></i>Sound <span>off</span></button>
      </header>

      <nav class="index" id="index" aria-label="Chapters"><ol id="index-list"></ol></nav>
      <div class="rail" aria-hidden="true"><i class="rail-fill" id="rail-fill"></i><span class="rail-now mono" id="rail-now"></span></div>

      <section class="block intro" id="intro">
        <p class="kicker mono" id="intro-kicker"></p>
        <h1 class="intro-title" id="intro-title"></h1>
        <p class="intro-now"><i aria-hidden="true"></i><span id="status-text"></span> <a id="status-link"></a><span id="status-also"></span></p>
      </section>

      <section class="block chapter" id="chapter" aria-live="polite">
        <p class="ch-meta mono"><span class="ch-num" id="ch-num"></span><span class="ch-rule"></span><span>Chapter</span></p>
        <h2 class="ch-title" id="ch-title"></h2>
        <p class="ch-line" id="ch-line"></p>
        <dl class="ch-stats" id="ch-stats"></dl>
      </section>

      <div class="block work-labels" id="work-labels"></div>
      <div class="frame-tags" id="frame-tags" aria-hidden="true"></div>

      <footer class="footer" id="footer">
        <div class="ft-l">
          <p class="ft-kick mono" id="ft-kick"></p>
          <h2 class="ft-title"><span id="ft-title"></span> <em id="ft-soft"></em></h2>
        </div>
        <div class="ft-r">
          <a class="ft-mail" id="ft-mail"></a>
          <nav class="ft-links mono" id="ft-links" aria-label="Elsewhere"></nav>
        </div>
        <div class="ft-base mono">
          <span id="ft-copy"></span>
          <button class="mono" data-jump="0">Begin again ↑</button>
        </div>
      </footer>

      <div class="scroll-cue mono" id="cue"><span>Scroll</span><i></i></div>
      <a class="pill-link" id="pill"><span>Get in touch</span><span class="pill-go" aria-hidden="true">↗</span></a>
    </main>

    <!-- a project's case study: a full page that opens over the trip -->
    <dialog class="cs" id="work-modal" aria-labelledby="wm-title">
      <div class="cs-scroll" id="cs-scroll">
        <header class="cs-bar">
          <button class="cs-back mono" id="wm-close"><span aria-hidden="true">←</span> Back to Saturn</button>
          <p class="cs-count mono" id="wm-count"></p>
          <div class="cs-arrows">
            <button class="cs-arrow" id="wm-prev" aria-label="Previous project">←</button>
            <button class="cs-arrow" id="wm-next" aria-label="Next project">→</button>
          </div>
        </header>

        <section class="cs-hero">
          <p class="cs-kick mono" id="wm-tag"></p>
          <h3 class="cs-title" id="wm-title"><span class="cs-title-n" id="wm-num"></span><b id="wm-name"></b></h3>
          <div class="cs-intro">
            <p class="cs-desc" id="wm-desc"></p>
            <div id="wm-live"></div>
          </div>
          <dl class="cs-meta" id="wm-meta"></dl>
        </section>

        <figure class="cs-shot" id="wm-stage"></figure>

        <section class="cs-band">
          <div class="cs-brief">
            <h4 class="mono">The brief</h4>
            <p id="wm-brief"></p>
          </div>
          <dl class="cs-facts" id="wm-facts"></dl>
        </section>

        <section class="cs-built">
          <h4 class="cs-h">What I built</h4>
          <ol id="wm-built"></ol>
        </section>

        <section class="cs-result">
          <h4 class="mono">The result</h4>
          <p id="wm-result"></p>
        </section>

        <a class="cs-next" id="wm-next-card">
          <span class="cs-next-txt">
            <span class="mono">Next case study</span>
            <b id="wm-next-name"></b>
            <span class="cs-next-tag mono" id="wm-next-tag"></span>
          </span>
          <span class="cs-next-img" id="wm-next-img"></span>
          <span class="cs-next-go" aria-hidden="true">↗</span>
        </a>
      </div>
    </dialog>

    <div id="loader">
      <div class="loader-inner">
        <p class="mono loader-k" id="loader-k">Laying the thread</p>
        <div class="loader-bar"><i id="loader-fill"></i></div>
        <p class="mono loader-p" id="loader-p">000</p>
        <div class="loader-enter" id="loader-enter" hidden>
          <button class="enter-btn on" data-enter="sound">Enter with sound</button>
          <button class="enter-btn" data-enter="mute">Enter muted</button>
        </div>
      </div>
    </div>

    <div id="cursor" aria-hidden="true"><i class="c-dot"></i><i class="c-ring"></i><span class="c-label mono">View</span></div>
  </body>
</html>
